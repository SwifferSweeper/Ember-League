name: Deploy to Railway

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli

      - name: Authenticate with Railway
        run: railway login --method=token --token=${{ secrets.RAILWAY_TOKEN }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        run: railway up --service league-tracker --environment production
        working-directory: ./league_tracker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
