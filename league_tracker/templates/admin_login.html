{% extends "base.html" %}

{% block title %}Admin Login - League Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Admin Login</h1>
    <p>Log in to manage teams and players</p>
</div>

<div class="form-container" style="max-width: 400px; margin: 0 auto;">
    <form method="POST" class="signup-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required 
                   placeholder="Enter username">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required 
                   placeholder="Enter password">
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-large btn-primary">Log In</button>
        </div>
        
        <p style="text-align: center; margin-top: 1rem;">
            <a href="{{ url_for('index') }}">Back to Home</a>
        </p>
    </form>
</div>
{% endblock %}
