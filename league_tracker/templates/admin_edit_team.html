{% extends "base.html" %}

{% block title %}Edit Team - League Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Team</h1>
    <p>Update team name</p>
</div>

<div class="form-container" style="max-width: 500px; margin: 0 auto;">
    <form method="POST" class="signup-form">
        <div class="form-section">
            <h2>Team Information</h2>
            <div class="form-group">
                <label for="team_name">Team Name *</label>
                <input type="text" id="team_name" name="team_name" required 
                       value="{{ team.name }}" placeholder="Enter team name">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-large btn-primary">Save Changes</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
