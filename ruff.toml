# Ruff configuration for Python linting and formatting
# https://docs.astral.sh/ruff/

# Target Python version
target-version = "py311"

# Line length
line-length = 100

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
]

[lint]
# Enable specific rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "ARG001", # Unused function argument (common in Flask routes)
    "ARG002", # Unused method argument
    "N806",   # Variable in function should be lowercase (common for API keys)
    "N803",   # Argument name should be lowercase
    "N802",   # Function name should be lowercase
    "SIM108", # Use ternary operator instead of if-else-block
    "UP038",  # Use `X | Y` instead of `X or Y` for type unions
]

# Allow autofix for enabled rules
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
# Specific ignores for certain files
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"app.py" = ["E402"]       # Allow imports not at top of file
"config.py" = ["E501"]     # Allow long lines in config

[format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Use spaces for line endings
line-ending = "auto"

# Enable preview mode for new features
preview = false

# Skip magic trailing comma
skip-magic-trailing-comma = false
