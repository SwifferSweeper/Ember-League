# Wrangler Configuration for League Tracker
# Cloudflare Workers deployment

name = "ember-league"
main = "worker/index.py"
compatibility_date = "2026-02-04"
compatibility_flags = ["python_workers"]

# Environment variables (secrets should be set via wrangler secret)
[vars]
DEBUG = "false"
AUTO_COLLECT_ENABLED = "true"
AUTO_COLLECT_INTERVAL = "5"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "league-tracker-db"
database_id = "your-database-id-here"

# KV namespace for session storage
[[kv_namespaces]]
binding = "SESSIONS"
id = "your-kv-namespace-id-here"

# R2 bucket for static assets (optional)
[[r2_buckets]]
binding = "STATIC_ASSETS"
bucket_name = "league-tracker-assets"

# Cron Triggers for scheduled tasks
[triggers]
crons = ["*/5 * * * *"]